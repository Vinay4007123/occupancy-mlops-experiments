name: Experiment 5 - Occupancy Continuous Delivery

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  train-test-deliver:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'


      # --------------------------------------------------
      # 3. Upgrade pip
      # --------------------------------------------------
      - name: Upgrade pip
        run: python -m pip install --upgrade pip


      # --------------------------------------------------
      # 4. Install ML + Flask dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: pip install -r Experiment-2/requirements.txt


      # --------------------------------------------------
      # 5. Train occupancy model
      # --------------------------------------------------
      - name: Train occupancy model
        run: python Experiment-2/train_model.py


      # --------------------------------------------------
      # 6. Check ML quality gate
      # --------------------------------------------------
      - name: Check ML quality gate
        run: python Experiment-3/quality_gate.py


      # --------------------------------------------------
      # 7. Run Experiment 2 ML tests
      # IMPORTANT:
      # Run from Experiment-2 so that
      # "from train_model import ..." works.
      # --------------------------------------------------
      - name: Run automated ML tests
        working-directory: Experiment-2
        run: python -m unittest test_ml_pipeline.py -v


      # --------------------------------------------------
      # 8. Run Experiment 5 Flask application tests
      # IMPORTANT:
      # Run from Experiment-5 so that
      # "from app import app" works.
      # --------------------------------------------------
      - name: Run prediction application tests
        working-directory: Experiment-5
        run: python -m unittest test_app.py -v


      # --------------------------------------------------
      # 9. Prepare release candidate
      # --------------------------------------------------
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate

          cp Experiment-5/app.py release_candidate/
          cp Experiment-2/occupancy_model.pkl release_candidate/
          cp Experiment-2/metrics.json release_candidate/
          cp Experiment-2/requirements.txt release_candidate/

          printf "Room Occupancy Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt


      # --------------------------------------------------
      # 10. Upload release candidate
      # --------------------------------------------------
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: occupancy-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
