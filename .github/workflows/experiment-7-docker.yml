name: Experiment 7 - Automated Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  train-test-containerize:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'


      - name: Upgrade pip
        run: python -m pip install --upgrade pip


      - name: Install ML and application dependencies
        run: pip install -r Experiment-2/requirements.txt


      - name: Train occupancy model
        run: python Experiment-2/train_model.py


      - name: Check ML quality gate
        run: python Experiment-3/quality_gate.py


      - name: Run ML pipeline tests
        working-directory: Experiment-2
        run: python -m unittest test_ml_pipeline.py -v


      - name: Run prediction application tests
        working-directory: Experiment-5
        run: python -m unittest test_app.py -v


      - name: Prepare Docker build context
        run: |
          mkdir -p docker_context

          cp Experiment-5/app.py docker_context/
          cp Experiment-2/occupancy_model.pkl docker_context/
          cp Experiment-2/metrics.json docker_context/
          cp Experiment-2/requirements.txt docker_context/
          cp Experiment-6/Dockerfile docker_context/
          cp Experiment-6/.dockerignore docker_context/

          echo "Docker build context:"
          ls -la docker_context


      - name: Build Docker image
        run: docker build -t occupancy-ml:${{ github.sha }} docker_context/


      - name: Start Docker container
        run: |
          docker run -d \
            --name occupancy-ml-container \
            -p 5000:5000 \
            occupancy-ml:${{ github.sha }}


      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do

            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2

          done

          echo "Application did not become ready."
          docker logs occupancy-ml-container
          exit 1


      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "S1_Temp": 25.75,
              "S2_Temp": 28.56,
              "S3_Temp": 25.19,
              "S4_Temp": 26.06,
              "S1_Light": 158,
              "S2_Light": 245,
              "S3_Light": 205,
              "S4_Light": 65,
              "S1_Sound": 0.91,
              "S2_Sound": 0.29,
              "S3_Sound": 2.83,
              "S4_Sound": 0.29,
              "S5_CO2": 650,
              "S5_CO2_Slope": 0.434615384615,
              "S6_PIR": 1,
              "S7_PIR": 1
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"

          echo "$response" | grep -q '"prediction"'


      - name: Show Docker container logs
        if: always()
        run: |
          docker logs occupancy-ml-container || true


      - name: Stop and remove Docker container
        if: always()
        run: |
          docker rm -f occupancy-ml-container || true
